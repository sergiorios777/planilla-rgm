<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar Sesión - Planillas RGM</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        /* Estilos para centrar la tarjeta de login vertical y horizontalmente */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--pico-background-color);
            margin: 0;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <article>
            <header style="text-align: center;">
                <h2 style="margin-bottom: 0;">💼 Planillas RGM</h2>
                <p><small>Acceso al Sistema</small></p>
            </header>

            <form hx-post="/login" hx-target="#error-msg" hx-swap="innerHTML">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" placeholder="admin@rgm.com" required>

                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>

                <button type="submit">Ingresar</button>

                <div id="error-msg" style="color: #b71c1c; text-align: center; margin-top: 1rem;"></div>
            </form>
        </article>
    </main>
</body>

</html>
