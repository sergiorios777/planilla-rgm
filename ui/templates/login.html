<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar Sesión - Planillas RGM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="/static/css/custom.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>

<body class="login-page">
    <main class="login-card">
        <article>
            <header class="text-center">
                <h2 class="mb-0">💼 Planillas RGM</h2>
                <p><small>Acceso al Sistema</small></p>
            </header>

            <form hx-post="/login" hx-target="#error-msg" hx-swap="innerHTML">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" placeholder="admin@rgm.com" required>

                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>

                <button type="submit">Ingresar</button>

                <div id="error-msg" class="text-danger text-center mt-md"></div>
            </form>
        </article>
    </main>
</body>

</html>
