<table class="striped">
    <thead>
        <tr>
            <th scope="col">Año</th>
            <th scope="col">Código</th>
            <th scope="col">Nivel</th>
            <th scope="col">Descripción</th>
            <th scope="col">Tipo</th>
        </tr>
    </thead>
    <tbody>
        {{range .}}
        <tr>
            <td>{{.Anio}}</td>
            <td><strong>{{.CodigoOriginal}}</strong></td>
            <td>{{.Nivel}}</td>
            <td>{{.Descripcion}}</td>
            <td>
                {{if eq .TipoTransaccion "Gasto"}}
                <mark
                    style="background-color: #ffcdd2; color: #b71c1c; border-radius: 4px; padding: 2px 6px;">Gasto</mark>
                {{else}}
                <mark
                    style="background-color: #c8e6c9; color: #1b5e20; border-radius: 4px; padding: 2px 6px;">Ingreso</mark>
                {{end}}
            </td>
        </tr>
        {{else}}
        <tr>
            <td colspan="5" style="text-align: center;">No hay clasificadores registrados.</td>
        </tr>
        {{end}}
    </tbody>
</table>
